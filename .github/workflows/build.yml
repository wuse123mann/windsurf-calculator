name: APK bauen

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests, APK (GitHub-Variante) und App-Bundle (Play-Variante) bauen
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testGithubDebugUnitTest assembleGithubRelease bundlePlayRelease

      - name: APK umbenennen
        run: cp app/build/outputs/apk/github/release/app-github-release.apk WindsurfRechner.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WindsurfRechner-apk
          path: WindsurfRechner.apk

      # Für den späteren Upload in die Play Console (nicht im öffentlichen Release)
      - uses: actions/upload-artifact@v4
        with:
          name: WindsurfRechner-play-aab
          path: app/build/outputs/bundle/playRelease/app-play-release.aab

      - name: APK im Branch "apk" ablegen
        run: |
          mkdir out && cp WindsurfRechner.apk out/
          cd out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add WindsurfRechner.apk
          git commit -q -m "APK Build ${{ github.run_number }} (${{ github.sha }})"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" apk

      - name: Release mit APK erstellen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v1.0.${{ github.run_number }}"
          gh release create "$VERSION" WindsurfRechner.apk \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Windsurf-Rechner ${VERSION#v}" \
            --notes "Automatischer Build ${{ github.run_number }} von ${GITHUB_SHA::7}: $(git log -1 --format=%s)" \
            --latest
